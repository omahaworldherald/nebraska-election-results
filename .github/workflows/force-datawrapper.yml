
name: Force Datawrapper Sync

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nebraska-results
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: datawrapper
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Force sync Datawrapper charts
        env:
          DATAWRAPPER_API_TOKEN: ${{ secrets.DATAWRAPPER_API_TOKEN }}
        run: python datawrapper_sync.py --apply --force

      - name: Save publication state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add config/datawrapper-published.json

          if ! git diff --cached --quiet; then
            git commit -m "Record forced Datawrapper sync"
            git pull --rebase
            git push
          else
            echo "No publication state changes"
          fi
