
name: Test Datawrapper API

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    environment: datawrapper

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test Datawrapper connection
        env:
          DATAWRAPPER_API_TOKEN: ${{ secrets.DATAWRAPPER_API_TOKEN }}
          DATAWRAPPER_CHART_ID: ${{ vars.DATAWRAPPER_CHART_ID }}
        run: python3 test_datawrapper.py
