name: Update Nebraska election feeds

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: nebraska-results
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment: datawrapper
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Download and convert official results
        run: python update.py --output public

      - name: Commit changed CSV feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/feeds
          if ! git diff --cached --quiet; then
            git commit -m "Update Nebraska election feeds"
            git push
          else
            echo "No data changes"
          fi

      - name: Sync changed Datawrapper charts
        id: sync
        continue-on-error: true
        env:
          DATAWRAPPER_API_TOKEN: ${{ secrets.DATAWRAPPER_API_TOKEN }}
        run: python datawrapper_sync.py --config config/datawrapper-charts.csv --apply --force

      - name: Inspect Datawrapper table settings
        env:
          DATAWRAPPER_API_TOKEN: ${{ secrets.DATAWRAPPER_API_TOKEN }}
        run: python inspect_table.py

      - name: Inspect Datawrapper colors
        env:
          DATAWRAPPER_API_TOKEN: ${{ secrets.DATAWRAPPER_API_TOKEN }}
        run: python inspect_colors.py
      
      - name: Save successful publication fingerprints
        if: always() && steps.sync.outcome != 'skipped'
        run: |
          git add config/datawrapper-published.json
          if ! git diff --cached --quiet; then
            git commit -m "Record published Datawrapper chart versions"
            git push
          else
            echo "No publication state changes"
          fi

      - name: Fail workflow if Datawrapper sync failed
        if: steps.sync.outcome == 'failure'
        run: exit 1
