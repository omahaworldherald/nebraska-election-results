
name: Update Nebraska election feeds

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: nebraska-results
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment: datawrapper
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Download and convert official results
        run: python update.py --output public

      - name: Commit changed CSV feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/feeds
          if ! git diff --cached --quiet; then
            git commit -m "Update Nebraska election feeds"
            git push
          else
            echo "No data changes"
          fi

      # Enable this step after the multi-chart
      # sync script is installed and tested.
