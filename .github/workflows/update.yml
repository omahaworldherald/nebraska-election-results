name: Update Nebraska election feeds
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: election-results
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and transform
        run: |
          python update.py --output public
          python build_views.py --public public --config config
      - name: Commit changed results
        run: |
          git config user.name 'election-results-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public
          if ! git diff --cached --quiet; then
            git commit -m 'Update Nebraska election feeds'
            git push
          fi
